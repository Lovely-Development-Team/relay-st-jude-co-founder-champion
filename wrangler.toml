name = "relay-st-jude-co-founder-champion-scoreboard"
main = "src/index.ts"
compatibility_date = "2026-06-16"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[cache]
enabled = true

[placement]
mode = "smart"

# Variable bindings. These are arbitrary, plaintext strings (similar to environment variables)
# Note: Use secrets to store sensitive data.
# Docs: https://developers.cloudflare.com/workers/platform/environment-variables
[vars]
ST_JUDE_SCOREBOARD_URL = "https://relay-scoreboard-v2.prod.experience.stjude.org/api/scoreboard"
APNS_BUNDLE_ID = "dev.snailedit.stjude" # TODO: confirm real bundle ID
APNS_LIVE_ACTIVITY_ATTRIBUTES_TYPE = "ScoreAttributes"
# Live Activities shouldn't start until the event does — an ISO 8601 instant.
LIVE_ACTIVITY_START_TIME = "2026-10-02T16:00:00Z"
# Once past this instant, the Live Activity is ended for good instead of being restarted.
LIVE_ACTIVITY_END_TIME = "2026-10-03T16:00:00Z"
# iOS force-ends a Live Activity after ~8h, so it needs restarting periodically for the rest of the
# event — this must stay comfortably under that OS cap.
LIVE_ACTIVITY_RESTART_INTERVAL_HOURS = "7"

# Bind a KV Namespace. Use KV as persistent storage for small key-value pairs.
# Docs: https://developers.cloudflare.com/workers/runtime-apis/kv
[[kv_namespaces]]
binding = "RELAY_FOR_ST_JUDE"
id = "470ca90f43294c0aa5bf6c789ded6095"

[secrets]
required = [
	"ST_JUDE_SCOREBOARD_KEY", "PUSH_TOKEN_UPDATE_KEY",
	"APNS_AUTH_KEY_SANDBOX", "APNS_KEY_ID_SANDBOX",
	"APNS_AUTH_KEY_PRODUCTION", "APNS_KEY_ID_PRODUCTION", "APNS_TEAM_ID",
]

# Bind a D1 database. Use D1 for relational storage.
# Docs: https://developers.cloudflare.com/d1/
[[d1_databases]]
binding = "WIDGET_PUSH_TOKENS"
database_name = "st-jude-widget-push-tokens"
database_id = "2b13162a-0046-44e7-b23c-3958ce2c5b20"
migrations_dir = "migrations"

# Bind an R2 Bucket. Use R2 to store arbitrarily large blobs of data, such as files.
# Docs: https://developers.cloudflare.com/r2/api/workers/workers-api-usage/
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# Bind a Queue producer. Use this binding to schedule an arbitrary task that may be processed later by a Queue consumer.
# Docs: https://developers.cloudflare.com/queues/get-started
# [[queues.producers]]
# binding = "MY_QUEUE"
# queue = "my-queue"

# Bind a Queue consumer. Queue Consumers can retrieve tasks scheduled by Producers to act on them.
# Docs: https://developers.cloudflare.com/queues/get-started
# [[queues.consumers]]
# queue = "my-queue"

# Bind another Worker service. Use this binding to call another Worker without network overhead.
# Docs: https://developers.cloudflare.com/workers/platform/services
# [[services]]
# binding = "MY_SERVICE"
# service = "/api/*"

# Bind a Durable Object. Durable objects are a scale-to-zero compute primitive based on the actor model.
# Durable Objects can live for as long as needed. Use these when you need a long-running "server", such as in realtime apps.
# Docs: https://developers.cloudflare.com/workers/runtime-apis/durable-objects
# [[durable_objects.bindings]]
# name = "MY_DURABLE_OBJECT"
# class_name = "MyDurableObject"

# Durable Object migrations.
# Docs: https://developers.cloudflare.com/workers/learning/using-durable-objects#configure-durable-object-classes-with-migrations
# [[migrations]]
# tag = "v1"
# new_classes = ["MyDurableObject"]

[[routes]]
pattern = "stjude-scoreboard.snailedit.org"
custom_domain = true

[[routes]]
pattern = "stjude-scoreboard.snailedit.online"
custom_domain = true

[triggers]
crons = ["*/15 * * * *"]
